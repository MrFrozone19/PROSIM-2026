# MySQL local para desarrollar la API (npm run dev en api/). En producción se usa Cloud SQL.
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: basedex-root
      MYSQL_DATABASE: basedex
      MYSQL_USER: basedex
      MYSQL_PASSWORD: basedex-dev
    ports:
      - '3307:3306'
    volumes:
      - basedex-mysql:/var/lib/mysql

volumes:
  basedex-mysql:
